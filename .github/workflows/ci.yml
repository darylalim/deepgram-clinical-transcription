name: CI

# The four gates the .claude/hooks/gates.sh Stop hook runs locally, plus a
# lockfile-drift check, on a Python matrix. This is the backstop for commits made
# outside Claude Code: the local hook fails OPEN and runs only after a commit
# already exists, so `ruff format --check` here is not redundant with it.
#
# THE JOB ID AND THE MATRIX VALUES ARE A BRANCH-PROTECTION CONTRACT. GitHub names
# an unnamed matrix job's check runs `<job-id> (<matrix value>)`, so `checks:`
# plus ["3.12", "3.13"] below are the sole source of the required status checks
# `checks (3.12)` / `checks (3.13)` named in the `main` ruleset. Renaming the job,
# adding a `name:` to it, or dropping a matrix leg renames or removes a required
# context — GitHub then holds it pending forever, every PR becomes unmergeable,
# and `gh pr merge --auto` in dependabot-auto-merge.yml waits on something that
# will never arrive, with no error raised anywhere. Change the ruleset FIRST.
# tests/test_ci_workflow.py pins both halves so this cannot drift silently.
#
# The matrix is also the only pin on the interpreter: there is no .python-version
# file, so `python-version: ${{ matrix.python-version }}` is what verifies the
# `requires-python = ">=3.12"` floor that README advertises.
on:
  push:
    branches: [main]
  # No `paths:` filter, deliberately: a docs-only change still has to prove the
  # gates pass, and PR check runs are what branch protection waits on.
  pull_request:
  # release.yml calls this file as a local reusable workflow to gate a release on
  # the gates passing at that commit. Do not remove without editing release.yml.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# PR runs key on refs/pull/N/merge and branch runs on refs/heads/main, so they
# never collide. Superseded runs are cancelled; releases are not cut from here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Both legs must report: a cancelled leg never goes green, so fail-fast
      # would leave a required check unresolved on the first failure.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here writes over git, so no credential belongs in .git/config.
          persist-credentials: false

      - name: Install uv + Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # `--locked` is the gate: it fails on lockfile drift rather than silently
      # re-resolving, which a bare `uv run` would do.
      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check .

      - name: Test
        run: uv run pytest
