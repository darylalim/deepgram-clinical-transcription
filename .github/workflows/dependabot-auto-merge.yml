name: dependabot auto-merge

# Lets the weekly grouped action-bump PR (see .github/dependabot.yml) land itself:
# this enables GitHub's auto-merge on it, so the PR merges only once the required
# CI checks pass. Majors are deliberately excluded — a major is where a breaking
# change actually hides (setup-uv v10.0.0 disabled the cache on sensitive events),
# so those still get a human.
#
# `pull_request_target` is required here, not incidental: a `pull_request` run
# triggered by Dependabot gets a READ-ONLY GITHUB_TOKEN that a `permissions:`
# block cannot elevate, and enabling auto-merge needs write. The danger of
# `pull_request_target` is running untrusted PR code with a writable token — this
# job never checks the pull request out and executes nothing from it, which is the
# documented safe shape. The workflow body is always read from the base branch, so
# a pull request cannot edit what runs here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Exactly the two scopes needed: merge the PR, and enable auto-merge on it.
permissions:
  contents: write
  pull-requests: write

# Serialize per pull request, and never abort a run mid-merge.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependabot's own pull requests on this repository only — the repository
    # guard keeps a fork from auto-merging on its own copy of this workflow.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'darylalim/deepgram-clinical-transcription'
    steps:
      # Also the integrity check: by default this step fails unless the branch
      # carries only Dependabot-authored commits, so a commit pushed onto the
      # branch stops the run rather than riding along into an auto-merge.
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge
        # `update-type` is the HIGHEST semver bump in the pull request, so this
        # holds for the grouped weekly PR too: one major anywhere in the group
        # keeps the whole PR manual. `--auto` queues the merge behind the required
        # checks instead of merging now; `--merge` matches this repo's history.
        # The PR URL goes through an env var, not a `${{ }}` shell interpolation.
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
