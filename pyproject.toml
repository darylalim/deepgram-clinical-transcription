[project]
name = "deepgram-clinical-transcription"
# Releases are cut by hand: bump this, land it on main, then
# `gh release create vX.Y.Z --generate-notes` (see README → Releases).
version = "0.11.0"
description = "Streamlit application for clinical transcription using Deepgram's Nova-3 Medical and Nova-3 Pharma models."
readme = "README.md"
authors = [{ name = "Daryl Lim" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "authlib==1.8.0",
    "deepgram-sdk==7.12.0",
    "python-dotenv==1.2.4",
    "streamlit[auth]==1.65.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.17.0",
    "ty==0.0.86",
    "watchdog==6.0.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is enforced by `ruff format`; the remaining long lines are
# intentional comments / test assertions the formatter chose not to wrap.
ignore = ["E501"]

[tool.ruff.lint.isort]
# Keep aliased re-exports in one parenthesized block instead of splitting them.
combine-as-imports = true
